name: Qualité
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spyfall
          POSTGRES_PASSWORD: spyfall_local
          POSTGRES_DB: spyfall
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spyfall"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://spyfall:spyfall_local@localhost:5432/spyfall
      TEST_DATABASE_URL: postgresql://spyfall:spyfall_local@localhost:5432/spyfall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
